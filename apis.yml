aid: ecovacs-robotics
name: ECOVACS Robotics
description: 'ECOVACS Robotics is a global home service robotics company founded in 1998 and headquartered
  in Suzhou, China, that designs, manufactures, and sells AI-powered autonomous cleaning devices for
  consumer and commercial use. Its product families include DEEBOT robotic vacuum and mopping robots,
  WINBOT window-cleaning robots, GOAT robotic lawn mowers, ULTRAMARINE pool-cleaning robots, and the
  DEEBOT PRO commercial line, all managed through the ECOVACS HOME mobile app. The company was added to
  the API Evangelist network as a portfolio company of IDG Capital; as of this enrichment pass ECOVACS
  publishes no public developer API, SDK, or documented API surface — this profile captures its public
  web, support, and legal properties plus a domain-security probe.'
